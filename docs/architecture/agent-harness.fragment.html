<div id="hks-agent-harness">
  <div class="viz-row ah-heading"><h2>错题 → 复习 → 孩子的知识树</h2><span class="viz-badge">B阶段 · 独立复验中</span></div>
  <div class="nav nav-pills" role="tablist" aria-label="架构视图">
    <button type="button" class="nav-link active" id="ah-tab-system" role="tab" aria-controls="ah-system" aria-selected="true">整体调用</button>
    <button type="button" class="nav-link" id="ah-tab-runtime" role="tab" aria-controls="ah-runtime" aria-selected="false">Harness 内部</button>
    <button type="button" class="nav-link" id="ah-tab-contract" role="tab" aria-controls="ah-contract" aria-selected="false">输入与输出</button>
    <button type="button" class="nav-link" id="ah-tab-growth" role="tab" aria-controls="ah-growth" aria-selected="false">成长闭环</button>
  </div>
  <div class="ah-clients" role="group" aria-label="调用 Agent 的系统">
    <button type="button" class="btn" data-client="web" aria-pressed="true">网页</button>
    <button type="button" class="btn" data-client="android" aria-pressed="false">Android</button>
    <button type="button" class="btn" data-client="esp32" aria-pressed="false">硬件设备</button>
    <button type="button" class="btn" data-client="tool" aria-pressed="false">AI 工具</button>
    <button type="button" class="btn" data-client="other" aria-pressed="false">其他系统</button>
  </div>
  <div id="ah-system" role="tabpanel" aria-labelledby="ah-tab-system">
    <div class="ah-row ah-cycle"><button type="button" class="btn" data-operation="study">AI 整理错题卡</button><span aria-hidden="true">→</span><button type="button" class="btn" data-operation="review.today">主动复习待办</button><span aria-hidden="true">→</span><button type="button" class="btn" data-operation="card.unlock">U1～U5 检验 · 解锁知识卡</button><span aria-hidden="true">→</span><button type="button" class="btn" data-operation="tree.move">孩子编排知识树</button></div>
    <div class="ah-arrow text-small">统一任务请求 ↓</div>
    <div class="ah-row"><button type="button" class="btn" data-node="adapter">调用方适配器</button><span aria-hidden="true">→</span><button type="button" class="btn" data-node="contract">统一调用契约</button></div>
    <div class="ah-arrow text-small">↓</div>
    <div class="ah-row"><button type="button" class="btn btn-primary" data-node="agent">领域 Agent</button><span aria-hidden="true">↔</span><button type="button" class="btn" data-node="harness">Harness 运行边界</button></div>
    <div class="ah-arrow text-small">工具与资源调用 ↓</div>
    <div class="ah-resources"><button type="button" class="btn" data-node="model">模型 · GPT 读图</button><button type="button" class="btn" data-node="tools">校验 / 教学工具</button><button type="button" class="btn" data-node="storage">会话 / 学习档案</button></div>
    <div class="ah-arrow text-small">结构化结果 ↑ 返回原调用方</div>
  </div>
  <div id="ah-runtime" role="tabpanel" aria-labelledby="ah-tab-runtime" hidden>
    <div class="ah-arrow text-small">请求进入 Harness ↓</div>
    <div class="ah-resources"><button type="button" class="btn" data-gate="H0">H0 输入边界</button><button type="button" class="btn" data-gate="H1">H1 结构校验</button><button type="button" class="btn" data-gate="H2">H2 数学核验</button><button type="button" class="btn" data-gate="H3">H3 教学法</button><button type="button" class="btn" data-gate="H4">H4 口吻</button><button type="button" class="btn" data-gate="H5">H5 安全</button><button type="button" class="btn" data-gate="H6">H6 语音口语化</button><button type="button" class="btn" data-gate="H7">H7 读图依据</button></div>
    <div class="ah-arrow text-small">约束 Agent 的每次执行 ↓</div>
    <div class="ah-row"><button type="button" class="btn btn-primary" data-node="agent">领域工作流 / Agent</button><span aria-hidden="true">↔</span><button type="button" class="btn" data-node="tools">受控工具适配器</button></div>
    <div class="ah-arrow text-small">结果检查与返回 ↓</div>
    <div class="ah-resources"><button type="button" class="btn" data-node="quality">数学与教学质检</button><button type="button" class="btn" data-node="commit">确认与副作用</button><button type="button" class="btn" data-node="trace">运行记录与评测</button></div>
  </div>
  <div id="ah-contract" role="tabpanel" aria-labelledby="ah-tab-contract" hidden>
    <div class="viz-controls"><label class="form-label" for="ah-operation">操作<select class="form-select" id="ah-operation" aria-label="查看操作的输入输出"></select></label><span id="ah-origin" class="viz-badge"></span></div>
    <div class="ah-contract-grid">
      <div><h3>输入</h3><pre><code id="ah-request"></code></pre></div>
      <div><h3>输出</h3><pre><code id="ah-response"></code></pre></div>
    </div>
  </div>
  <div id="ah-growth" role="tabpanel" aria-labelledby="ah-tab-growth" hidden>
    <div class="ah-row ah-cycle" role="group" aria-label="复习习惯四阶段">
      <button type="button" class="btn" data-habit="trigger" aria-pressed="true">触发 · 错题与复习任务</button><span aria-hidden="true">→</span>
      <button type="button" class="btn" data-habit="action" aria-pressed="false">行动 · 适度挑战</button><span aria-hidden="true">→</span>
      <button type="button" class="btn" data-habit="reward" aria-pressed="false">酬赏 · 卡片与树成长</button><span aria-hidden="true">→</span>
      <button type="button" class="btn" data-habit="investment" aria-pressed="false">投入 · 笔记与知识关系</button><span aria-hidden="true">↺</span>
    </div>
    <div class="ah-row"><button type="button" class="btn" data-operation="quiz.start">三题检验</button><span aria-hidden="true">→</span><button type="button" class="btn" data-operation="card.unlock">全部条件通过 · 解锁</button><span aria-hidden="true">→</span><button type="button" class="btn" data-operation="growth.get">规模 + 茂盛度 + 关联</button><span aria-hidden="true">→</span><button type="button" class="btn" data-operation="leaderboard.get">小组每周成长榜</button></div>
    <div class="ah-arrow"><span class="viz-badge">起点 · 待数据</span></div>
    <div class="ah-row"><span>知识卡 +10 / 张</span><span aria-hidden="true">+</span><span>间隔复习 +3 / 次</span><span aria-hidden="true">+</span><span>合理关联 +2 / 条</span></div>
  </div>
  <div id="ah-detail" class="ah-detail text-small" aria-live="polite">同一 Agent 能被不同系统调用，领域逻辑不依赖某个页面或设备。</div>
</div>

#hks-agent-harness { display:grid; gap:calc(var(--font-size-base) * 1); color:var(--foreground); }
#hks-agent-harness .ah-heading { padding-inline-end:calc(var(--font-size-base) * 5.5); }
#hks-agent-harness .ah-clients { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:calc(var(--font-size-base) * .5); }
#hks-agent-harness .ah-resources { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:calc(var(--font-size-base) * .5); }
#hks-agent-harness .ah-row { display:flex; align-items:center; justify-content:center; gap:calc(var(--font-size-base) * .75); flex-wrap:wrap; }
#hks-agent-harness .ah-arrow { text-align:center; color:var(--muted-foreground); margin:calc(var(--font-size-base) * .6) 0; }
#hks-agent-harness .ah-detail { color:var(--muted-foreground); min-height:calc(var(--font-size-base) * 2.5); }
#hks-agent-harness .ah-cycle { margin-block:calc(var(--font-size-base) * 1); }
#hks-agent-harness .ah-contract-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:calc(var(--font-size-base) * 1); }
#hks-agent-harness pre { margin:calc(var(--font-size-base) * .5) 0 0; color:var(--foreground); white-space:pre-wrap; overflow-wrap:anywhere; }
@media (max-width:600px) {
  #hks-agent-harness .ah-clients { grid-template-columns:repeat(2,minmax(0,1fr)); }
  #hks-agent-harness .ah-resources, #hks-agent-harness .ah-contract-grid { grid-template-columns:minmax(0,1fr); }
}
</style>

<script>
(() => {
  const root = document.getElementById('hks-agent-harness');
  const data = JSON.parse(document.getElementById('ah-contract-data').textContent);
  const clients = {web:'网页',android:'Android',esp32:'硬件设备',tool:'AI 工具',other:'其他系统'};
  const details = {
    adapter:'适配器只转换设备、传输与显示形式；不复制 Agent 的诊断、教学或记分逻辑。',
    contract:'各调用方共用版本化输入输出契约；具体字段由同一 Schema 校验。',
    agent:'Agent 编排错题卡、复习、知识卡、个人树、画像与推荐；当前领域是初中数学，主线已通过12段HTTP自测，画像推荐等仍待后续。',
    harness:'Harness 包围 Agent 的执行，提供上下文、工具边界、运行限制、输出核验和记录。',
    model:'读图使用 gpt-6.1-sol；模型负责读与讲，不能代替程序核验或自己改学习记录。',
    tools:'工具按允许的能力调用；符号校验、练习、排期与数据访问通过明确接口连接。',
    storage:'档案由数据适配器维护；浏览器编号不是正式身份认证，目标架构仍需实现授权。',
    entry:'先检查输入、调用来源和允许操作；客户端不能自行授予工具权限。',
    context:'按会话与学习记录装配上下文，模型看到的内容不能改变可信规则。',
    budget:'限制执行时间、请求与工具消耗；失败明确返回，不暗中重复付费请求。',
    quality:'区分程序核验、AI 分析和待核对；保留学生真实错误与提示等级边界。',
    commit:'需要确认的结果不直接写学习进度；重复请求不能重复计数或推进复习。',
    trace:'记录版本、阶段、耗时和验证依据；普通日志不保存密钥或原始儿童资料。'
  };
  const gates={
    H0:'H0 · 检查大小、格式、步数和幂等；失败拒绝。已有统一入口与输入校验，仍须核对每项具体边界。',
    H1:'H1 · 输出须符合 Schema；不合格不放行。统一入口按权威JSON Schema做运行时校验。',
    H2:'H2 · 可支持的数学由程序核验；其他标 AI 待核对，不能据此自动记错或点亮。',
    H3:'H3 · 低级提示不泄露最终结果；检查失败回退到已核对提示并标注。已有部分基础。',
    H4:'H4 · 口吻具体、不贴标签；失败重写或回退。待实施。',
    H5:'H5 · 情绪表达使用预设策略，并提示监护人关注。待实施。',
    H6:'H6 · 公式口语化、控制长度，为硬件提供简版文本。语音适配待实施。',
    H7:'H7 · 用学生同题书写作为模糊字符推断依据，保留真实错误；不足时给候选。独立任务待验收。'
  };
  const habits={
    trigger:'触发：学校错题引出首次拍题；下一轮由合适时间的具体复习任务承接。提醒客户端已联调，实际通知可见性待独立验收。',
    action:'行动：三题全对且无提示升档、两题对保持、至多一题对降档；连续两组困难则回讲解。均为起点，可随时停。',
    reward:'酬赏：三题至少两题合格正确，含迁移、全组verified、合格题未用完整解法、服务端保存才解锁。复习每点最多计3次、关联最多20条；本阶段不做随机酬赏。',
    investment:'投入：用自己的话补笔记、整理知识关联并积累偏好，下一次复习据此更贴合孩子。'
  };
  let currentClient='web',currentOperation='review.today',currentGate=null,currentHabit='trigger';
  const operationSelect=document.getElementById('ah-operation');
  Object.entries(data.examples).forEach(([operation,example])=>{
    const option=document.createElement('option');option.value=operation;option.textContent=operation+' · '+data.labels[operation];operationSelect.appendChild(option);
  });
  function applyClient(value) {
    currentClient=clients[value]?value:'web';
    root.querySelectorAll('[data-client]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.client===currentClient)));
    const example=data.examples[currentOperation];
    operationSelect.value=currentOperation;
    const request=JSON.parse(JSON.stringify(example.request));
    request.client.type=currentClient;
    request.options.modalities=currentClient==='esp32'?['text','audio']:['text','svg'];
    document.getElementById('ah-request').textContent=JSON.stringify(request,null,2);
    document.getElementById('ah-response').textContent=JSON.stringify(example.response,null,2);
    document.getElementById('ah-origin').textContent=example.provenance.kind==='runtime_http'?'真实HTTP输出 · 假模型 / 调用方适配示意':(example.provenance.kind==='synthetic_design'?'历史设计样例 · 非运行证据':'历史结果投影 · 非统一入口抓包');
    const growthActive=document.getElementById('ah-tab-growth').getAttribute('aria-selected')==='true';
    document.getElementById('ah-detail').textContent=growthActive?habits[currentHabit]:(currentGate?gates[currentGate]:clients[currentClient]+' → 同一 Agent / Harness → '+currentOperation+'；提醒由终端承担。');
  }
  function save() {
    const tab=root.querySelector('[role="tab"][aria-selected="true"]');
    if(window.openai && typeof window.openai.setWidgetState==='function') {
      window.openai.setWidgetState({modelContent:{caller:currentClient,operation:currentOperation,gate:currentGate,habit:currentHabit},privateContent:{tab:tab?tab.id:'ah-tab-system'}}).catch(()=>{});
    }
  }
  function restore(saved) {
    const state=saved||{};
    const model=state.modelContent||state;
    currentOperation=data.examples[model.operation]?model.operation:'review.today';
    currentGate=gates[model.gate]?model.gate:null;
    currentHabit=habits[model.habit]?model.habit:'trigger';
    root.querySelectorAll('[data-habit]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.habit===currentHabit)));
    applyClient(state.modelContent&&state.modelContent.caller||state.caller||'web');
    const tab=state.privateContent&&state.privateContent.tab;
    if(tab&&root.querySelector('#'+tab)) {
      root.querySelectorAll('[role="tab"]').forEach(button=>{
        const active=button.id===tab;
        button.setAttribute('aria-selected',String(active));button.classList.toggle('active',active);
        document.getElementById(button.getAttribute('aria-controls')).hidden=!active;
      });
    }
    if(tab==='ah-tab-growth')document.getElementById('ah-detail').textContent=habits[currentHabit];
  }
  root.querySelectorAll('[data-client]').forEach(button=>button.addEventListener('click',()=>{applyClient(button.dataset.client);save();}));
  root.querySelectorAll('[data-habit]').forEach(button=>button.addEventListener('click',()=>{currentHabit=button.dataset.habit;root.querySelectorAll('[data-habit]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));document.getElementById('ah-detail').textContent=habits[currentHabit];save();}));
  root.querySelectorAll('[data-node]').forEach(button=>button.addEventListener('click',()=>{document.getElementById('ah-detail').textContent=details[button.dataset.node];}));
  root.querySelectorAll('[data-gate]').forEach(button=>button.addEventListener('click',()=>{currentGate=button.dataset.gate;document.getElementById('ah-detail').textContent=gates[currentGate];save();}));
  root.querySelectorAll('[data-operation]').forEach(button=>button.addEventListener('click',()=>{currentOperation=button.dataset.operation;currentGate=null;applyClient(currentClient);document.getElementById('ah-tab-contract').click();save();}));
  operationSelect.addEventListener('change',()=>{currentOperation=operationSelect.value;currentGate=null;applyClient(currentClient);save();});
  root.querySelectorAll('[role="tab"]').forEach(button=>button.addEventListener('click',()=>{if(button.id==='ah-tab-growth')document.getElementById('ah-detail').textContent=habits[currentHabit];setTimeout(save,0);}));
  window.addEventListener('openai:set_globals',event=>{const globals=event.detail&&event.detail.globals;if(globals&&globals.widgetState)restore(globals.widgetState);});
  restore(window.openai&&window.openai.widgetState);
})();
</script>
